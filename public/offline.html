<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d4ed8">
  <title>You're offline | Sport Academy</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f8fafc;color:#0f172a;font:16px/1.6 system-ui,sans-serif}
    main{max-width:440px;text-align:center;background:white;padding:36px;border:1px solid #e2e8f0;border-radius:24px;box-shadow:0 20px 50px #0f172a12}
    img{width:88px;height:88px}h1{font-size:1.7rem;margin:18px 0 8px}p{color:#475569}button{border:0;border-radius:12px;background:#1d4ed8;color:white;padding:12px 20px;font-weight:700;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <img src="/images/pwa-icon.svg" alt="">
    <h1>You're offline</h1>
    <p>The Sport Academy system needs an internet connection to safely load your account and live records. Reconnect, then try again.</p>
    <button onclick="window.location.reload()">Try again</button>
  </main>
</body>
</html>
